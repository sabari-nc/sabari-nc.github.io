# Site settings
title: "Sabari Nathan, C."
description: "Portfolio and academic website"
baseurl: ""  
url: "https://sabari-nc.github.io"
repository: "sabari-nc/sabari-nc.github.io"

# Navigation Bar
header_pages:
  - about.md
  - publications.md
  - CV.md

# Author settings
author:
  name: "Sabari Nathan, C."
  email: "sabarinathan070@outlook.com"
  twitter: ""
  github: "https://github.com/sabari-nc"
  linkedin: "https://www.linkedin.com/in/sabarinathan070"
  scholar: "https://scholar.google.co.in/citations?user=31xfF3UAAAAJ&hl=en"
  researchgate: "https://www.researchgate.net/profile/Sabari-Nathan-C/stats"
  avatar: "assets/images/profile.jpg"

# Publication Category - The following the list of publication categories and their headings
publication_category:
  books:
    title: 'Journal Articles'
  manuscripts:
    title: 'Conference Papers'    
  conferences:
    title: 'Journal Articles in process'

# Site Settings
teaser                   :  # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false      # change to true to add link to talkmap on talks page
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            :
  discourse:
    server               : # e.g., https://meta.discourse.org
  facebook:
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"
atom_feed:
  hide                   : false
  path                   : # leave blank to use default feed.xml

# Build settings
remote_theme: "AcademicPages"
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-archives

# Collections
collections:
  pages:
    output: true
    permalink: /:path/

# Sass settings
sass:
  sass_dir: _sass
  style: compressed

# Layout defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      author_profile: true
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author_profile: true